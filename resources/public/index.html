<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minhas Tarefas</title>
    <!-- Fonte Poppins (Google Fonts); sem internet, cai na fonte do sistema -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Paleta: índigo sóbrio, sem gradientes */
      :root {
        --fundo: #e9e8f1;
        --card: #ffffff;
        --texto: #26253a;
        --suave: #73718a;
        --apagado: #a7a5b8;
        --borda: #e4e2ec;
        --indigo: #4a47a3;
        --indigo-escuro: #3b3887;
        --indigo-claro: #f0effa;
        --vermelho: #c0392b;
      }
      body {
        font-family: "Poppins", "Segoe UI", Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        background-color: var(--fundo);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 64px 16px;
        box-sizing: border-box;
        color: var(--texto);
      }
      /* Fundo: grade de pontinhos discreta (fixa ao rolar a página) */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-image: radial-gradient(rgba(74, 71, 163, 0.16) 1.2px, transparent 1.6px);
        background-size: 24px 24px;
      }
      /* A largura fica fixa (não encolhe com o conteúdo) */
      #app {
        width: 100%;
        max-width: 540px;
      }
      .todo-app {
        background: var(--card);
        padding: 32px;
        border: 1px solid var(--borda);
        border-radius: 10px;
        box-shadow: 0 1px 3px rgba(38, 37, 58, 0.06);
      }
      h1 {
        margin: 0 0 2px;
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--texto);
      }
      /* Subtítulo logo abaixo do título */
      .todo-app > p {
        margin: 0 0 24px;
        color: var(--suave);
        font-size: 0.9rem;
      }
      .todo-input {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .todo-input input[type="text"] {
        flex: 1;
        min-width: 0; /* deixa o campo encolher em telas estreitas */
        padding: 10px 12px;
        border: 1px solid var(--borda);
        border-radius: 6px;
        font-family: inherit;
        font-size: 0.95rem;
        color: var(--texto);
        transition: border-color 0.15s;
      }
      .todo-input input[type="text"]::placeholder {
        color: var(--apagado);
      }
      .todo-input input[type="text"]:focus {
        outline: none;
        border-color: var(--indigo);
      }
      /* A lista: linhas separadas por um fio, sem cartões */
      .todo-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .todo-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 4px;
        border-bottom: 1px solid var(--borda);
      }
      .todo-item:last-child {
        border-bottom: none;
      }
      /* O título ocupa todo o espaço entre o checkbox e o botão X */
      .todo-title {
        flex: 1;
        font-size: 0.95rem;
        word-break: break-word;
      }
      .todo-checkbox {
        width: 17px;
        height: 17px;
        margin: 0;
        accent-color: var(--indigo);
        cursor: pointer;
      }
      /* O botão "Adicionar" */
      button {
        padding: 10px 18px;
        background: var(--indigo);
        color: #ffffff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 500;
        transition: background-color 0.15s, color 0.15s;
      }
      button:hover {
        background: var(--indigo-escuro);
      }
      /* O botão de deletar (X): só aparece ao passar o mouse na tarefa */
      .delete-btn {
        background: transparent;
        color: var(--apagado);
        font-size: 0.85rem;
        padding: 4px 8px;
        opacity: 0;
      }
      .todo-item:hover .delete-btn,
      .delete-btn:focus {
        opacity: 1;
      }
      .delete-btn:hover {
        background: transparent;
        color: var(--vermelho);
      }
      /* Item concluído: só o título fica riscado (não o botão X) */
      .completed .todo-title {
        text-decoration: line-through;
        color: var(--apagado);
      }
      /* Mensagem de lista vazia */
      .empty-list {
        text-align: center;
        color: var(--apagado);
        font-size: 0.9rem;
        padding: 24px 0;
        margin: 0;
      }
      /* Rodapé: contador de pendentes + filtros */
      .todo-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
        padding-top: 14px;
        border-top: 1px solid var(--borda);
      }
      .todo-count {
        color: var(--suave);
        font-size: 0.85rem;
      }
      .filters {
        display: flex;
        gap: 2px;
      }
      /* Botões de filtro: só texto; o ativo fica destacado */
      .filter-btn {
        background: transparent;
        color: var(--suave);
        font-size: 0.85rem;
        font-weight: 400;
        padding: 4px 10px;
        border-radius: 4px;
      }
      .filter-btn:hover {
        background: transparent;
        color: var(--texto);
      }
      .filter-btn.active {
        background: var(--indigo-claro);
        color: var(--indigo);
        font-weight: 500;
      }
      /* Status da API: carregando e erro */
      .loading {
        color: var(--suave);
        font-size: 0.9rem;
        margin-bottom: 12px;
      }
      .error {
        padding: 10px 12px;
        margin-bottom: 14px;
        font-size: 0.9rem;
        color: var(--vermelho);
        border-left: 3px solid var(--vermelho);
        background-color: #fdf3f2;
      }
    </style>
  </head>
  <body>
    <div id="app">Carregando...</div>

    <script src="/js/main.js"></script>
  </body>
</html>
